{% extends 'base.html' %}
{% block title %}{{ 'Edit' if product else 'Add' }} product — Aurel & Thread{% endblock %}
{% block content %}<section class="auth-page section-pad"><div class="auth-card form-card reveal"><span class="eyebrow">CATALOGUE EDITOR</span><h1>{{ 'Refine this' if product else 'Add a new' }} <em>piece.</em></h1><p>Keep the details clear and the image crisp.</p>
<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Product name<input name="name" type="text" maxlength="80" required value="{{ product['name'] if product else '' }}"></label>
<label>Category<select name="category" required><option value="">Choose a category</option><option value="dresses" {% if product and product['category']=='dresses' %}selected{% endif %}>Dresses</option><option value="watches" {% if product and product['category']=='watches' %}selected{% endif %}>Watches</option></select></label>
<label>Price (INR)<input name="price" type="number" min="0.01" max="1000000" step="0.01" required value="{{ '%.2f'|format(product['price_paise']/100) if product else '' }}"></label>
<label>Short description<textarea name="description" rows="3" maxlength="240" required>{{ product['description'] if product else '' }}</textarea></label>
<label>Product image URL <span class="field-help">HTTPS image link from Unsplash, Pexels or Cloudinary</span><input name="image_url" type="url" required value="{{ product['image_url'] if product else '' }}" placeholder="https://images.unsplash.com/..."></label>
<label>Small label (optional)<input name="tag" type="text" maxlength="30" value="{{ product['tag'] if product else '' }}" placeholder="New arrival"></label>
<label class="check-label"><input type="checkbox" name="featured" {% if product and product['featured'] %}checked{% endif %}> Feature this product near the top</label>
<div class="form-actions"><button class="button button-dark" type="submit">{{ 'Save changes' if product else 'Add to collection' }} <span>↗</span></button><a class="text-link" href="{{ url_for('admin_dashboard') }}">Cancel</a></div></form></div></section>{% endblock %}
