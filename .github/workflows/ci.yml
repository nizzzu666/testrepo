name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          PYTHONPATH: .
          SECRET_KEY: ci-test-secret-key
          ADMIN_PASSWORD_HASH: scrypt:32768:8:1$test$not-a-real-hash
          COOKIE_SECURE: "false"
